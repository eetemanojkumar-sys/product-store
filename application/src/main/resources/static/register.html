<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Product Store</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;font-family:Arial,sans-serif;color:#172033}
    .card{width:min(420px,calc(100% - 32px));background:white;padding:30px;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 8px 30px #17203312}
    h1{margin:0 0 8px}p{color:#667085;font-size:14px}label{display:block;margin:16px 0 7px;font-size:14px;font-weight:600}
    input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:8px;font-size:15px}
    button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:#3157d5;color:white;font-weight:700;cursor:pointer}
    a{color:#3157d5;text-decoration:none}.msg{margin-top:14px;font-size:13px;color:#b42318}
  </style>
</head>
<body><main class="card">
  <h1>Create your account</h1><p>Register to access the Product Store.</p>
  <form id="register-form">
    <label for="name">Full name</label><input id="name" maxlength="80" required autocomplete="name">
    <label for="email">Email</label><input id="email" type="email" maxlength="160" required autocomplete="email">
    <label for="password">Password</label><input id="password" type="password" minlength="8" maxlength="72" required autocomplete="new-password">
    <button id="submit" type="submit">Create account</button><div class="msg" id="message"></div>
  </form>
  <p>Already registered? <a href="/login.html">Sign in</a></p>
</main>
<script>
const form=document.getElementById('register-form'),message=document.getElementById('message'),button=document.getElementById('submit');
form.addEventListener('submit',async e=>{
  e.preventDefault();message.textContent='';button.disabled=true;button.textContent='Creating account…';
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.message||'Registration failed.');
    location.href='/login.html?registered=1';
  }catch(err){message.textContent=err.message;}
  finally{button.disabled=false;button.textContent='Create account';}
});
</script></body></html>
