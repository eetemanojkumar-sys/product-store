<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Product Store</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;font-family:Arial,sans-serif;color:#172033}
    .card{width:min(420px,calc(100% - 32px));background:white;padding:30px;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 8px 30px #17203312}
    h1{margin:0 0 8px}p{color:#667085;font-size:14px}label{display:block;margin:18px 0 7px;font-size:14px;font-weight:600}
    input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:8px;font-size:15px}
    button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:#3157d5;color:white;font-weight:700;cursor:pointer}
    a{color:#3157d5;text-decoration:none}.msg{margin-top:14px;font-size:13px;color:#b42318}
  </style>
</head>
<body><main class="card">
  <h1>Welcome back</h1><p>Sign in to your Product Store account.</p>
  <form id="login-form">
    <label for="email">Email</label><input id="email" type="email" required autocomplete="email">
    <label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
    <button id="submit" type="submit">Sign in</button><div class="msg" id="message"></div>
  </form>
  <p>New here? <a href="/register.html">Create an account</a></p>
</main>
<script>
const form=document.getElementById('login-form'), message=document.getElementById('message'), button=document.getElementById('submit');
fetch('/api/auth/me').then(r=>{if(r.ok)location.href='/';});
form.addEventListener('submit',async e=>{
  e.preventDefault();message.textContent='';button.disabled=true;button.textContent='Signing in…';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.message||'Login failed. Check your email and password.');
    location.href='/';
  }catch(err){message.textContent=err.message;}
  finally{button.disabled=false;button.textContent='Sign in';}
});
</script></body></html>
